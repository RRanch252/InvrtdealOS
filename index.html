<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Cedar — INVRT close desk</title>
  <style>
    :root {
      --bg: #0e1110;
      --panel: #161a19;
      --line: #2a312f;
      --ink: #e8ebe6;
      --dim: #8b948e;
      --amber: #d4a017;
      --live: #c45c26;
      --ok: #3d9a6a;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .top {
      display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: end;
      padding: 16px 20px 12px; border-bottom: 1px solid var(--line);
    }
    .code { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--amber); text-transform: uppercase; }
    h1 { font-size: 22px; font-weight: 600; margin: 2px 0 0; }
    .clock { font-family: var(--mono); font-size: 28px; color: var(--amber); }
    .clock span { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }
    .stats { display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .stats b { color: var(--ink); font-size: 16px; }
    nav { display: flex; gap: 4px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
    nav button { background: transparent; border: 0; color: var(--dim); padding: 8px 10px; }
    nav button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); }
    main { display: grid; grid-template-columns: 1.4fr 0.9fr; min-height: calc(100vh - 120px); }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } .top { grid-template-columns: 1fr; } }
    .blotter { border-right: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.row { cursor: pointer; }
    tr.row:hover { background: #1c2220; }
    tr.row.on { background: #222826; }
    .st { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .st.open { color: var(--live); }
    .st.agreed { color: var(--ok); }
    .st.seller { color: var(--amber); }
    .detail { padding: 16px 18px 80px; }
    .detail h2 { font-size: 16px; margin: 0 0 8px; }
    .muted { color: var(--dim); font-size: 13px; line-height: 1.45; }
    label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 12px 0 4px; }
    textarea, input { width: 100%; background: var(--bg); border: 1px solid var(--line); padding: 8px; }
    textarea { min-height: 72px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btns button, .ghost {
      background: var(--panel); border: 1px solid var(--line); padding: 8px 12px;
    }
    .btns .go { background: var(--ok); border-color: var(--ok); color: #04150c; font-weight: 600; }
    .btns .warn { background: var(--live); border-color: var(--live); color: #fff; }
    .paper {
      white-space: pre-wrap; font-family: var(--mono); font-size: 12px; line-height: 1.5;
      background: #0a0c0b; border: 1px solid var(--line); padding: 16px; max-height: 70vh; overflow: auto;
    }
    .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .kpi div { background: var(--panel); border: 1px solid var(--line); padding: 10px; }
    .kpi b { display: block; font-family: var(--mono); font-size: 18px; }
    .warnbar { padding: 8px 20px; background: #2a1810; color: #e8c4a8; font-size: 12px; display: none; }
    .phase { display: flex; gap: 6px; padding: 8px 20px 0; flex-wrap: wrap; }
    .phase i { font-style: normal; font-size: 11px; padding: 4px 8px; border: 1px solid var(--line); color: var(--dim); }
    .phase i.on { border-color: var(--amber); color: var(--amber); }
    .phase i.done { color: var(--ok); border-color: #245c40; }
  </style>
</head>
<body onload="Desk.init()">
  <div class="warnbar" id="gh">GitHub will not run this. Download product/deal-os/close-desk/index.html and open it locally.</div>
  <header class="top">
    <div>
      <div class="code">INVRT · sell-side · 100% shares</div>
      <h1>Project Cedar — Brennan Precision</h1>
      <div class="muted">Helix Engineering buying. INVRT owns commercials. Counsel papers the SPA.</div>
    </div>
    <div class="clock" id="clock"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="phase" id="phase"></div>
  <nav>
    <button type="button" class="on" data-v="points" onclick="Desk.view('points')">Commercials</button>
    <button type="button" data-v="model" onclick="Desk.view('model')">Model</button>
    <button type="button" data-v="people" onclick="Desk.view('people')">People / ops</button>
    <button type="button" data-v="paper" onclick="Desk.view('paper')">Paper</button>
    <button type="button" data-v="close" onclick="Desk.view('close')">Close</button>
  </nav>
  <main>
    <section class="blotter" id="left"></section>
    <aside class="detail" id="right"></aside>
  </main>
  <script>
    var Desk = {
      key: "invrt-cedar-v1",
      sel: "p1",
      tab: "points",
      seed: function () {
        return {
          day: 8,
          daysTotal: 42,
          points: [
            { id: "p1", block: true, title: "Headline price", seller: "€48.0m cash-free debt-free on FY26E.", buyer: "€45.0m CFDD. Will not look at €48m without earn-out only.", agreed: "", status: "open" },
            { id: "p2", block: true, title: "Locked box vs completion accounts", seller: "Locked box 31 Dec 2025. Ordinary course leakage only.", buyer: "Completion accounts. Do not trust locked box with family drawings.", agreed: "", status: "open" },
            { id: "p3", block: true, title: "Earn-out", seller: "€5.0m over 2 years if EBITDA ≥ €6.5m. Reported EBITDA.", buyer: "€5.0m but adjusted EBITDA (add-backs they control). Hurdle €7.0m.", agreed: "", status: "open" },
            { id: "p4", block: false, title: "Perimeter — factory vs family yard", seller: "Factory in OpCo is in. Adjacent yard stays in family PropCo; 10-year market lease.", buyer: "Want yard in the deal or a call option at close.", agreed: "", status: "open" },
            { id: "p5", block: false, title: "Leakage / bonuses", seller: "FY26 accrued bonuses in ordinary course are not leakage.", buyer: "Any family bonus above prior-year run-rate is leakage.", agreed: "", status: "open" },
            { id: "p6", block: true, title: "MD employment", seller: "Siobhán Brennan: 18 months MD, then 12 months advisory. Salary €220k.", buyer: "18 months OK. Want 6-month garden leave and buyer as employer.", agreed: "18-month MD; then 12-month advisory; employer = Helix; salary €220k. Garden leave still open under non-compete.", status: "seller" },
            { id: "p7", block: false, title: "Non-compete", seller: "UK & Ireland, 18 months, precision components only.", buyer: "Worldwide, 24 months, industrials.", agreed: "", status: "open" },
            { id: "p8", block: false, title: "Family recharges stop", seller: "Two recharges (€420k) cease at close.", buyer: "Agreed.", agreed: "Family recharges of €420k cease at close. No replacement service agreement unless Helix asks in writing.", status: "agreed" },
            { id: "p9", block: false, title: "Group FD day 1", seller: "Accept buyer FD. Plant GM stays.", buyer: "Group FD day 1. No dual finance.", agreed: "Helix Group FD from completion. Plant GM retained. No dual FD.", status: "agreed" },
            { id: "p10", block: false, title: "Exclusivity", seller: "Exclusivity through the 6-week close, then drops.", buyer: "Exclusivity to close or 8 weeks, whichever first.", agreed: "Exclusivity until the earlier of close or day 42 of this sprint.", status: "agreed" }
          ],
          cps: [
            { id: "c1", title: "Commercials frozen (this blotter)", done: false },
            { id: "c2", title: "Term sheet issued from agreed points — or written waiver to go straight to SPA", done: false },
            { id: "c3", title: "Counsel pack sent (do not paper live points)", done: false },
            { id: "c4", title: "SPA first draft from seller counsel", done: false },
            { id: "c5", title: "MD employment agreed and in draft", done: false },
            { id: "c6", title: "Disclosure letter process open", done: false },
            { id: "c7", title: "Funds flow + debt payoff quotes", done: false },
            { id: "c8", title: "Sign and complete", done: false }
          ],
          model: {
            ebitda: 6.9,
            netDebt: 4.1,
            headline: 48,
            earnout: 5
          }
        };
      },
      init: function () {
        if (/github\.com|githubusercontent/.test(location.host)) document.getElementById("gh").style.display = "block";
        try { this.d = JSON.parse(localStorage.getItem(this.key)) || this.seed(); }
        catch (e) { this.d = this.seed(); }
        if (!this.d.points) this.d = this.seed();
        this.render();
      },
      save: function () { localStorage.setItem(this.key, JSON.stringify(this.d)); },
      reset: function () { this.d = this.seed(); this.save(); this.sel = "p1"; this.render(); },
      view: function (t) { this.tab = t; this.render(); },
      pick: function (id) { this.sel = id; this.tab = "points"; this.render(); },
      pt: function () { return this.d.points.filter(function (p) { return p.id === Desk.sel; })[0] || this.d.points[0]; },
      n: function (st) { return this.d.points.filter(function (p) { return p.status === st; }).length; },
      blockers: function () { return this.d.points.filter(function (p) { return p.block && p.status !== "agreed"; }); },
      toast: function (m) { var n = document.getElementById("stats"); n.setAttribute("data-msg", m); },
      write: function (field) {
        var p = this.pt();
        p[field] = document.getElementById("f-" + field).value;
        this.save(); this.render();
      },
      setStatus: function (st) {
        var p = this.pt();
        p.status = st;
        if (st === "agreed" && !p.agreed) p.agreed = p.seller;
        this.save(); this.render();
      },
      agreeSeller: function () {
        var p = this.pt();
        p.agreed = p.seller;
        p.status = "agreed";
        this.save(); this.render();
      },
      agreeBuyer: function () {
        var p = this.pt();
        p.agreed = p.buyer;
        p.status = "agreed";
        this.save(); this.render();
      },
      toggleCp: function (id) {
        this.d.cps.forEach(function (c) { if (c.id === id) c.done = !c.done; });
        this.save(); this.render();
      },
      copyPaper: function (which) {
        var t = which === "ts" ? this.ts() : this.counsel();
        navigator.clipboard.writeText(t).then(function () { alert("Copied. Paste into Word / email."); }, function () {
          prompt("Copy this:", t);
        });
      },
      ts: function () {
        var d = this.d;
        var agreed = d.points.filter(function (p) { return p.status === "agreed"; });
        var live = d.points.filter(function (p) { return p.status !== "agreed"; });
        var lines = [];
        lines.push("PROJECT CEDAR — HEADS OF TERMS (DRAFT FROM DEAL OS)");
        lines.push("Sell-side · Brennan Precision Ltd → Helix Engineering Ltd · 100% shares");
        lines.push("INVRT commercials. Not legal advice. Counsel to paper SPA.");
        lines.push("Day " + d.day + " of " + d.daysTotal + ".");
        lines.push("");
        lines.push("AGREED — paper these");
        agreed.forEach(function (p) { lines.push("• " + p.title + ": " + p.agreed); });
        if (!agreed.length) lines.push("• None yet.");
        lines.push("");
        lines.push("STILL LIVE — do not paper, do not leak");
        live.forEach(function (p) { lines.push("• " + p.title + " [seller] " + p.seller + " [buyer] " + p.buyer); });
        if (this.blockers().length) {
          lines.push("");
          lines.push("BLOCKING A TERM SHEET: " + this.blockers().map(function (p) { return p.title; }).join("; "));
        }
        return lines.join("\n");
      },
      counsel: function () {
        var d = this.d;
        var agreed = d.points.filter(function (p) { return p.status === "agreed"; });
        var live = d.points.filter(function (p) { return p.status !== "agreed"; });
        return [
          "COUNSEL PACK — PROJECT CEDAR",
          "From: INVRT (commercials)",
          "To: Seller counsel — paper SPA and MD employment from AGREED points only.",
          "",
          "Parties: Brennan Holdings Ltd (seller) / Brennan Precision Ltd (target) / Helix Engineering Ltd (buyer).",
          "Deal: 100% share sale. Jurisdiction-agnostic drafting; INVRT will not litigate governing law.",
          "",
          "DOCUMENT THESE COMMERCIALS IN THE SPA / EMPLOYMENT:",
          agreed.map(function (p) { return "• " + p.title + " — " + p.agreed; }).join("\n") || "• None agreed. Do not draft yet.",
          "",
          "DO NOT DRAFT AS CLOSED — still in commercial negotiation:",
          live.map(function (p) { return "• " + p.title; }).join("\n") || "• None.",
          "",
          "Operating model to reflect: Helix Group FD from completion; plant GM retained; family recharges €420k off at close.",
          "Model snapshot: FY26E EBITDA €" + d.model.ebitda + "m; net debt €" + d.model.netDebt + "m; headline €" + d.model.headline + "m; earn-out €" + d.model.earnout + "m."
        ].join("\n");
      },
      render: function () {
        var d = this.d;
        document.getElementById("clock").innerHTML = d.day + " / " + d.daysTotal + "<span>days used / sprint</span>";
        document.getElementById("stats").innerHTML =
          "<div><b>" + this.n("open") + "</b> live</div><div><b>" + this.n("agreed") + "</b> agreed</div><div><b>" + this.blockers().length + "</b> blocking TS</div>";
        var day = d.day;
        document.getElementById("phase").innerHTML =
          "<i class='" + (day <= 7 ? "on" : "done") + "'>W1 freeze price</i>" +
          "<i class='" + (day > 7 && day <= 14 ? "on" : day > 14 ? "done" : "") + "'>W2 paper</i>" +
          "<i class='" + (day > 14 && day <= 28 ? "on" : day > 28 ? "done" : "") + "'>W3–4 SPA / employment</i>" +
          "<i class='" + (day > 28 ? "on" : "") + "'>W5–6 disclose · funds · close</i>";
        document.querySelectorAll("nav button").forEach(function (b) {
          b.className = b.getAttribute("data-v") === Desk.tab ? "on" : "";
        });
        if (this.tab === "points") this.renderPoints();
        else if (this.tab === "model") this.renderModel();
        else if (this.tab === "people") this.renderPeople();
        else if (this.tab === "paper") this.renderPaper();
        else this.renderClose();
      },
      renderPoints: function () {
        var p = this.pt();
        document.getElementById("left").innerHTML = "<table><thead><tr><th></th><th>Point</th><th>Seller</th><th>Buyer</th></tr></thead><tbody>" +
          this.d.points.map(function (x) {
            return "<tr class='row" + (x.id === Desk.sel ? " on" : "") + "' onclick=\"Desk.pick('" + x.id + "')\">" +
              "<td class='st " + x.status + "'>" + x.status + (x.block && x.status !== "agreed" ? " · block" : "") + "</td>" +
              "<td>" + x.title + "</td>" +
              "<td class='muted'>" + x.seller.slice(0, 72) + (x.seller.length > 72 ? "…" : "") + "</td>" +
              "<td class='muted'>" + x.buyer.slice(0, 72) + (x.buyer.length > 72 ? "…" : "") + "</td></tr>";
          }).join("") + "</tbody></table>";
        document.getElementById("right").innerHTML =
          "<div class='code'>Work the point</div><h2>" + p.title + "</h2>" +
          (p.block && p.status !== "agreed" ? "<p class='muted'>Blocks a term sheet until agreed.</p>" : "") +
          "<label>Seller (INVRT / Brennan)</label><textarea id='f-seller'>" + p.seller.replace(/</g, "") + "</textarea>" +
          "<label>Buyer (Helix)</label><textarea id='f-buyer'>" + p.buyer.replace(/</g, "") + "</textarea>" +
          "<label>Agreed commercial (what counsel may paper)</label><textarea id='f-agreed'>" + (p.agreed || "").replace(/</g, "") + "</textarea>" +
          "<div class='btns'>" +
          "<button type='button' onclick=\"Desk.write('seller');Desk.write('buyer');Desk.write('agreed')\">Save</button>" +
          "<button type='button' onclick='Desk.agreeSeller()'>Agree seller wording</button>" +
          "<button type='button' onclick='Desk.agreeBuyer()'>Agree buyer wording</button>" +
          "<button type='button' class='go' onclick=\"Desk.setStatus('agreed')\">Mark agreed</button>" +
          "<button type='button' onclick=\"Desk.setStatus('open')\">Re-open</button>" +
          "</div>" +
          "<p class='muted' style='margin-top:16px'>Job: get this to agreed or kill it. Do not write a memo about it.</p>" +
          "<div class='btns'><button type='button' class='ghost' onclick='Desk.reset()'>Reset sample deal</button></div>";
      },
      renderModel: function () {
        var m = this.d.model;
        var eq = (m.headline - m.netDebt).toFixed(1);
        document.getElementById("left").innerHTML =
          "<div class='detail'><p class='muted'>Numbers that feed the commercials. Not a replacement model. Change a driver, then go back to the point it affects.</p>" +
          "<div class='kpi'><div><b>€" + m.ebitda + "m</b> FY26E EBITDA</div><div><b>€" + m.headline + "m</b> headline</div><div><b>€" + eq + "m</b> equity value (headline − net debt)</div></div>" +
          "<label>FY26E EBITDA €m</label><input id='m-ebitda' value='" + m.ebitda + "'>" +
          "<label>Net debt €m</label><input id='m-netDebt' value='" + m.netDebt + "'>" +
          "<label>Headline €m</label><input id='m-headline' value='" + m.headline + "'>" +
          "<label>Earn-out €m</label><input id='m-earnout' value='" + m.earnout + "'>" +
          "<div class='btns'><button type='button' class='go' onclick='Desk.saveModel()'>Save into deal file</button></div>" +
          "<p class='muted'>Locked box date in sample: 31 Dec 2025. INVRT fee 1.25% of equity value + 0.4% kicker.</p></div>";
        document.getElementById("right").innerHTML =
          "<h2>What the model is for</h2><p class='muted'>Helix argues €45m because they haircut FY26. Brennan’s table is €48m on €6.9m. Earn-out is the bridge. If headline moves, edit point “Headline price” so paper and model do not diverge.</p>" +
          "<p class='muted'>Operating: recharges €0.42m off at close is already agreed. Do not double-count in EBITDA unless you reopen that point.</p>";
      },
      saveModel: function () {
        this.d.model.ebitda = parseFloat(document.getElementById("m-ebitda").value);
        this.d.model.netDebt = parseFloat(document.getElementById("m-netDebt").value);
        this.d.model.headline = parseFloat(document.getElementById("m-headline").value);
        this.d.model.earnout = parseFloat(document.getElementById("m-earnout").value);
        this.save(); this.render();
      },
      renderPeople: function () {
        document.getElementById("left").innerHTML =
          "<div class='detail'><h2>Operating model</h2>" +
          "<p><strong>Stay:</strong> Plant GM, quality lead, production system 18 months.</p>" +
          "<p><strong>Change:</strong> Helix Group FD day 1. Family recharges off.</p>" +
          "<p><strong>MD:</strong> Siobhán Brennan — 18-month MD then 12-month advisory. Garden leave / non-compete still live (points 6–7).</p>" +
          "<p class='muted'>Employment is a commercial. Counsel drafts the contract from the agreed point, not from a side email.</p></div>";
        document.getElementById("right").innerHTML =
          "<h2>Who can kill the close</h2><p class='muted'>Siobhán (seller MD). Helix FD (buyer day-1 operator). Family on the yard. If employment or the yard is still live in week 5, the SPA will slip. Work those points now.</p>";
      },
      renderPaper: function () {
        var block = this.blockers();
        document.getElementById("left").innerHTML =
          "<div class='detail'><h2>Term sheet (from blotter)</h2>" +
          (block.length ? "<p class='muted'>Cannot honestly issue a TS while blocking points are live: " + block.map(function (p) { return p.title; }).join("; ") + ".</p>" : "<p class='muted'>No blocking points live. You may issue.</p>") +
          "<div class='paper'>" + this.ts().replace(/</g, "&lt;") + "</div>" +
          "<div class='btns'><button type='button' class='go' onclick=\"Desk.copyPaper('ts')\">Copy term sheet</button></div></div>";
        document.getElementById("right").innerHTML =
          "<h2>Counsel pack</h2><p class='muted'>This is what INVRT sends so lawyers do not invent commercials.</p>" +
          "<div class='paper'>" + this.counsel().replace(/</g, "&lt;") + "</div>" +
          "<div class='btns'><button type='button' class='go' onclick=\"Desk.copyPaper('counsel')\">Copy counsel pack</button>" +
          "<button type='button' onclick=\"Desk.d.cps[2].done=true;Desk.save();Desk.view('close')\">Mark pack sent</button></div>";
      },
      renderClose: function () {
        document.getElementById("left").innerHTML =
          "<div class='detail'><h2>Six-week close</h2><p class='muted'>Tick only what is done. Do not add a programme office.</p><table>" +
          this.d.cps.map(function (c) {
            return "<tr class='row' onclick=\"Desk.toggleCp('" + c.id + "')\"><td class='st " + (c.done ? "agreed" : "open") + "'>" + (c.done ? "done" : "open") + "</td><td>" + c.title + "</td></tr>";
          }).join("") + "</table></div>";
        document.getElementById("right").innerHTML =
          "<h2>How INVRT gets paid</h2><p class='muted'>Success 1.25% of equity value at close + 0.4% equity kicker. If commercials are not frozen, counsel cannot paper, and day 42 is a conversation not a completion.</p>" +
          "<p class='muted'>Today is day " + this.d.day + ". Blocking TS points: " + this.blockers().length + ".</p>";
      }
    };
  </script>
</body>
</html>
